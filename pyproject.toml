[project]
name = "eval-as-a-service"
version = "1.0.0"
description = "Upload prompt/output CSVs, score them with rubric checks and an LLM judge, gate deploys on the score."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
eaas = "eaas.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["eaas"]

[tool.setuptools.package-data]
eaas = ["static/*.html"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["eaas/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905", "B008"]  # B008: FastAPI File()/Form() defaults are the idiom

[tool.pytest.ini_options]
testpaths = ["tests"]

x-app: &app
  build: .
  environment:
    MOCK_MODE: ${MOCK_MODE:-1}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    JUDGE_MODEL: ${JUDGE_MODEL:-claude-sonnet-5-5}
    DATABASE_URL: postgresql://eaas:eaas@db:5432/eaas
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eaas
      POSTGRES_PASSWORD: eaas
      POSTGRES_DB: eaas
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eaas"]
      interval: 2s
      retries: 30

  api:
    <<: *app
    ports:
      - "${API_PORT:-8102}:8000"
    command: ["uvicorn", "eaas.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    <<: *app
    command: ["python", "-m", "eaas.worker"]

volumes:
  pgdata:
